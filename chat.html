<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check in with Danning</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff7f4;
      --text: #121212;
      --muted: #555;
      --border: #121212;
      --border-light: #d4cfc9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Masthead ── */
    .masthead {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: stretch;
      gap: 0;
      flex-shrink: 0;
    }

    .masthead .site-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: var(--text);
      padding: 1.25rem 0;
      margin-right: 2rem;
      white-space: nowrap;
    }

    .masthead .back-link {
      display: flex;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding: 1.25rem 0;
      margin-left: auto;
      transition: color 0.15s;
    }

    .masthead .back-link:hover { color: var(--text); }

    /* ── Chat area ── */
    .chat-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .chat-intro {
      max-width: 560px;
      align-self: center;
      text-align: center;
      padding: 2rem 0 1rem;
    }

    .chat-intro h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.6rem;
    }

    .chat-intro p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Messages ── */
    .message {
      display: flex;
      max-width: 640px;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.agent { align-self: flex-start; }

    .bubble {
      padding: 0.85rem 1.1rem;
      line-height: 1.6;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
    }

    .message.agent .bubble {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-light);
    }

    .meta-line {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.3rem;
      padding: 0 0.25rem;
    }

    .message.user .meta-line { text-align: right; }

    /* ── Typing indicator ── */
    .typing { display: flex; gap: 4px; align-items: center; padding: 0.85rem 1.1rem; border: 1px solid var(--border-light); }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    /* ── Markdown rendering in agent bubbles ── */
    .message.agent .bubble p { margin-bottom: 0.6em; }
    .message.agent .bubble p:last-child { margin-bottom: 0; }
    .message.agent .bubble ul,
    .message.agent .bubble ol { padding-left: 1.4em; margin-bottom: 0.6em; }
    .message.agent .bubble li { margin-bottom: 0.25em; }
    .message.agent .bubble strong { font-weight: 600; }
    .message.agent .bubble em { font-style: italic; }
    .message.agent .bubble code {
      font-family: monospace;
      font-size: 0.85em;
      background: rgba(0,0,0,0.06);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }
    .message.agent .bubble pre {
      background: rgba(0,0,0,0.06);
      padding: 0.75em 1em;
      border-radius: 4px;
      overflow-x: auto;
      margin-bottom: 0.6em;
    }
    .message.agent .bubble pre code { background: none; padding: 0; }
    .message.agent .bubble h1,
    .message.agent .bubble h2,
    .message.agent .bubble h3 { font-weight: 600; margin-bottom: 0.4em; }

    /* ── Input bar ── */
    .input-bar {
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .input-bar textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border-light);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
      min-height: 44px;
      max-height: 120px;
    }

    .input-bar textarea:focus { border-color: var(--text); }
    .input-bar textarea::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 0 1.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s;
      flex-shrink: 0;
      align-self: flex-end;
      height: 44px;
    }

    .send-btn:disabled { opacity: 0.35; cursor: default; }
    .send-btn:not(:disabled):hover { opacity: 0.8; }

    /* ── Error notice ── */
    .error-notice {
      font-size: 0.8rem;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      padding: 0.6rem 1rem;
      background: #fff1f2;
      align-self: flex-start;
      max-width: 480px;
    }
  </style>
</head>
<body>

  <nav class="masthead">
    <a class="site-name" href="/">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;margin-right:6px;">
        <circle cx="9" cy="4" r="2" fill="currentColor"/>
        <path d="M6 8.5 Q9 7 12 8.5 L11 14 H9.5 L9 11 L8.5 14 H7 Z" fill="currentColor"/>
        <path d="M7 14 L5.5 17 M11 14 L12.5 17" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>Walk in Progress</a>
    <a class="back-link" href="/">← Back</a>
  </nav>

  <div class="chat-wrap" id="chatWrap">
    <div class="chat-intro">
      <h1>Talk to my<br>digital twin.</h1>
      <p>An AI trained on how I think — ask it about what I'm working on,<br>what I pay attention to, or anything else.</p>
    </div>
  </div>

  <div class="input-bar">
    <textarea
      id="input"
      placeholder="Ask something…"
      rows="1"
      onInput="autoResize(this)"
      onKeydown="handleKey(event)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()" disabled>Send</button>
  </div>

  <script>
    const AGENT_URL = 'https://le-site-production.up.railway.app/query'
    const chatWrap = document.getElementById('chatWrap')
    const input = document.getElementById('input')
    const sendBtn = document.getElementById('sendBtn')
    let busy = false

    input.addEventListener('input', () => {
      sendBtn.disabled = !input.value.trim() || busy
    })

    function autoResize(el) {
      el.style.height = 'auto'
      el.style.height = Math.min(el.scrollHeight, 120) + 'px'
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        send()
      }
    }

    function addMessage(type, text, meta) {
      const wrap = document.createElement('div')
      wrap.className = `message ${type}`

      const bubble = document.createElement('div')
      bubble.className = 'bubble'
      if (type === 'agent') {
        bubble.innerHTML = marked.parse(text)
      } else {
        bubble.textContent = text
      }
      wrap.appendChild(bubble)

      if (meta) {
        const m = document.createElement('div')
        m.className = 'meta-line'
        m.textContent = meta
        wrap.appendChild(m)
      }

      chatWrap.appendChild(wrap)
      wrap.scrollIntoView({ behavior: 'smooth', block: 'end' })
      return wrap
    }

    function addTyping() {
      const wrap = document.createElement('div')
      wrap.className = 'message agent'
      wrap.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'
      chatWrap.appendChild(wrap)
      wrap.scrollIntoView({ behavior: 'smooth', block: 'end' })
      return wrap
    }

    async function send() {
      const text = input.value.trim()
      if (!text || busy) return

      busy = true
      sendBtn.disabled = true
      input.value = ''
      input.style.height = 'auto'

      addMessage('user', text)
      const typing = addTyping()

      try {
        const res = await fetch(AGENT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text, user_id: 'visitor' })
        })

        if (!res.ok) throw new Error(`${res.status}`)
        const data = await res.json()
        typing.remove()
        const secs = data.processing_time ? `${data.processing_time.toFixed(1)}s` : ''
        addMessage('agent', data.answer, secs)
      } catch (err) {
        typing.remove()
        const wrap = document.createElement('div')
        wrap.className = 'message agent'
        wrap.innerHTML = '<div class="error-notice">Couldn\'t reach the agent. Try again in a moment.</div>'
        chatWrap.appendChild(wrap)
      }

      busy = false
      sendBtn.disabled = !input.value.trim()
      input.focus()
    }

    input.focus()
  </script>

</body>
</html>
