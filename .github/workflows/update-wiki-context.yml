name: Update wiki context

on:
  push:
    paths:
      - 'wiki/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile wiki context
        run: python build_wiki_context.py

      - name: Commit updated wiki context
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update wiki context from wiki changes"
          file_pattern: agent/wiki_context.md
